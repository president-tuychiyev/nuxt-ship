services:
  web:
    image: ${IMAGE_NAME:-my-university-ui}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-my-university-ui}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-3000}:3000"
    networks:
      - app_network

networks:
  app_network:
    external: true
